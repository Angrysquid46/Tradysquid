[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".venv",
  ".venv-worker",
  ".venv-dev",
  "state",
  "docs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
