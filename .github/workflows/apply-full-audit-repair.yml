name: Apply full audit repair

on:
  pull_request:
    branches:
      - clean-rebuild
    paths:
      - ".github/full-audit-repair-trigger"

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.head_ref == 'trigger-full-audit-repair'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out clean rebuild
        uses: actions/checkout@v4
        with:
          ref: clean-rebuild
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply audited repairs
        shell: pwsh
        run: |
          python scripts/apply_full_audit_repairs.py
          Remove-Item -LiteralPath scripts/apply_full_audit_repairs.py -Force
          Remove-Item -LiteralPath .github/workflows/apply-full-audit-repair.yml -Force

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $Failures = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ErrorRecord in $Errors) {
              $Failures += "$($_.FullName):$($ErrorRecord.Extent.StartLineNumber):$($ErrorRecord.Extent.StartColumnNumber) $($ErrorRecord.Message)"
            }
          }
          if ($Failures.Count -gt 0) {
            $Failures | ForEach-Object { Write-Host $_ }
            throw 'PowerShell parsing failed.'
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --editable .
          python -m pip check

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q tradysquid scripts tests

      - name: Run complete suite
        shell: pwsh
        run: python -m pytest

      - name: Run production installation verifier
        shell: pwsh
        run: python -m scripts.verify_installation

      - name: Commit verified repairs
        shell: pwsh
        run: |
          git config user.name "Tradysquid Audit Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw 'Audit repair produced no repository changes.'
          }
          git commit -m "Repair full runtime audit findings"
          git push origin HEAD:clean-rebuild
