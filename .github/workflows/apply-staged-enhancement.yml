name: Apply staged clean-rebuild enhancement

on:
  push:
    branches: [clean-rebuild]
    paths:
      - '.staged/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract validated source bundle
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import base64
          import io
          import tarfile

          root = Path.cwd().resolve()
          stage = root / '.staged'
          encoded = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(stage.glob('payload-*.txt'))
          )
          data = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Unsafe archive path: {member.name}')
              archive.extractall(root)
          '@ | python -
      - name: Remove temporary staging machinery
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .staged
          Remove-Item -Force .github/workflows/apply-staged-enhancement.yml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q tradysquid scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Commit verified enhancement
        shell: pwsh
        run: |
          git config user.name 'Tradysquid Clean Rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete clean-rebuild controls and lifecycle services'
          git push origin HEAD:clean-rebuild
