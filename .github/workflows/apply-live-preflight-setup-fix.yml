name: Apply Live Preflight Setup Fix

on:
  pull_request:
    paths:
      - 'scripts/apply_live_preflight_setup_fix.py'
      - '.github/workflows/apply-live-preflight-setup-fix.yml'
      - 'scripts/verify_live.py'
      - 'tests/unit/test_live_verification_offhours.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply exact setup patch
        run: python scripts/apply_live_preflight_setup_fix.py
      - name: Parse repaired PowerShell
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/setup.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run focused preflight tests
        run: python -m pytest -q tests/unit/test_live_verification_offhours.py tests/unit/test_setup_live_preflight_reporting.py
      - name: Commit tested setup repair
        shell: powershell
        run: |
          git config user.name 'tradysquid-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Setup patch produced no committed changes.' }
          git commit -m 'Report live preflight and preserve degraded provider install'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
