name: Resource Mesh Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "market_data_runtime.py"
      - "provider_lanes.py"
      - "targeted_scan_runtime.py"
      - "resource_mesh.py"
      - "resource_mesh_worker.py"
      - "resource_mesh_runtime.py"
      - "security_hygiene.py"
      - "test_resource_mesh.py"
      - "test_market_data_runtime.py"
      - "requirements-worker.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/resource-mesh-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, windows, x64, tradysquid-worker]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-worker.txt
            requirements-dev.txt

      - name: Install quality dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile resource runtime
        shell: pwsh
        run: |
          python -m py_compile market_data_runtime.py provider_lanes.py targeted_scan_runtime.py resource_mesh.py resource_mesh_worker.py resource_mesh_runtime.py security_hygiene.py

      - name: Run secret hygiene
        run: python security_hygiene.py

      - name: Run Ruff
        shell: pwsh
        run: |
          python -m ruff check market_data_runtime.py provider_lanes.py targeted_scan_runtime.py resource_mesh.py resource_mesh_worker.py resource_mesh_runtime.py security_hygiene.py test_resource_mesh.py test_market_data_runtime.py
          python -m ruff format --check market_data_runtime.py provider_lanes.py targeted_scan_runtime.py resource_mesh.py resource_mesh_worker.py resource_mesh_runtime.py security_hygiene.py test_resource_mesh.py test_market_data_runtime.py

      - name: Run unit tests
        run: python -m unittest -q test_resource_mesh.py test_market_data_runtime.py

      - name: Audit Python dependencies
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-worker.txt
