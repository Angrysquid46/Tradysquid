name: Apply audit follow-up

on:
  pull_request:
    branches:
      - clean-rebuild
    paths:
      - ".github/audit-followup-trigger"

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.head_ref == 'trigger-full-audit-repair-v2'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out clean rebuild
        uses: actions/checkout@v4
        with:
          ref: clean-rebuild
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply final audited cleanup fix
        shell: pwsh
        run: |
          python scripts/apply_full_audit_followup.py
          Remove-Item -LiteralPath scripts/apply_full_audit_followup.py -Force
          Remove-Item -LiteralPath .github/workflows/apply-audit-followup.yml -Force
          if (Test-Path -LiteralPath tradysquid.egg-info) {
            Remove-Item -LiteralPath tradysquid.egg-info -Recurse -Force
          }

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $Failures = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ErrorRecord in $Errors) {
              $Failures += "$($_.FullName):$($ErrorRecord.Extent.StartLineNumber):$($ErrorRecord.Extent.StartColumnNumber) $($ErrorRecord.Message)"
            }
          }
          if ($Failures.Count -gt 0) {
            $Failures | ForEach-Object { Write-Host $_ }
            throw 'PowerShell parsing failed.'
          }

      - name: Create isolated production virtual environment
        shell: pwsh
        run: |
          py -3.12 -m venv .venv-tradysquid
          $Python = Join-Path (Get-Location) '.venv-tradysquid\Scripts\python.exe'
          if (!(Test-Path -LiteralPath $Python -PathType Leaf)) {
            throw 'Isolated interpreter was not created.'
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          $Python = Join-Path (Get-Location) '.venv-tradysquid\Scripts\python.exe'
          & $Python -m pip install --upgrade pip
          & $Python -m pip install -r requirements-dev.txt
          & $Python -m pip install --editable .
          & $Python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency validation failed.' }

      - name: Compile source
        shell: pwsh
        run: |
          $Python = Join-Path (Get-Location) '.venv-tradysquid\Scripts\python.exe'
          & $Python -m compileall -q tradysquid scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }

      - name: Run complete suite
        shell: pwsh
        run: |
          $Python = Join-Path (Get-Location) '.venv-tradysquid\Scripts\python.exe'
          & $Python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Run production verifier
        shell: pwsh
        run: |
          $Python = Join-Path (Get-Location) '.venv-tradysquid\Scripts\python.exe'
          & $Python -m scripts.verify_installation
          if ($LASTEXITCODE -ne 0) { throw 'Installation verification failed.' }

      - name: Commit final audited repair
        shell: pwsh
        run: |
          git config user.name "Tradysquid Audit Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw 'Audit follow-up produced no changes.'
          }
          git commit -m "Finish full runtime audit repairs"
          git push origin HEAD:clean-rebuild
