name: Ford Options Scan

on:
  schedule:
    # Every 5 minutes on weekdays.
    #
    # This UTC window covers 8:30 AM through 3:00 PM Central Time
    # during both CST and CDT. The Python script performs the exact
    # Central Time market-hours check and exits outside that window.
    - cron: "30-55/5 13 * * 1-5"
    - cron: "*/5 14-20 * * 1-5"
    - cron: "0 21 * * 1-5"

  # Allows manual testing from the GitHub Actions page.
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scanner runs from editing the CSV at the same time.
concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Ford options scan
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -e "state" ]; then
            git add -A state
          fi

          if [ -e "docs" ]; then
            git add -A docs
          fi

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
