name: Ford Options Scan

run-name: "Ford scan • ${{ github.event_name }} • #${{ github.run_number }}"

on:
  schedule:
    # Every 15 minutes during regular market hours in Central Time.
    # Offset from common quarter-hour boundaries to reduce scheduler congestion.

    # 8:38 AM and 8:53 AM CT
    - cron: "38,53 8 * * 1-5"
      timezone: "America/Chicago"

    # Every 15 minutes from 9:08 AM through 2:53 PM CT
    - cron: "8,23,38,53 9-14 * * 1-5"
      timezone: "America/Chicago"

  # Keeps the manual Run workflow button.
  workflow_dispatch:

permissions:
  contents: write

# Prevent a manual and scheduled run from editing the files simultaneously.
concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan and update Ford plays
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"

    steps:
      - name: Show trigger information
        shell: bash
        run: |
          echo "Trigger type: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Central time: $(TZ=America/Chicago date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      - name: Verify required secrets
        shell: bash
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          missing=0

          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN is missing."
            missing=1
          fi

          if [ -z "$TRADIER_BASE_URL" ]; then
            echo "::error::TRADIER_BASE_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Create required folders
        shell: bash
        run: |
          mkdir -p state
          mkdir -p docs

      - name: Run Ford options scanner
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No trade-state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "Scanner updates pushed successfully."
            exit 0
          fi

          echo "Remote changed during the scan. Rebasing and retrying."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
