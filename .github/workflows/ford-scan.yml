name: Multi-Ticker Options Scan

run-name: "Ticker scan • ${{ github.event_name }} • #${{ github.run_number }}"

on:
  # Local monitoring is the primary scheduler. Keep this as an on-demand
  # cloud backup without consuming recurring GitHub Actions minutes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-ticker-options-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan all active ticker strategies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"

    steps:
      - name: Show trigger information
        shell: bash
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Central: $(TZ=America/Chicago date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile ford_scan.py dynamic_universe.py multi_ticker_scan.py sync_discord_structure.py ensure_tradingview_secret.py

      - name: Verify required secrets
        shell: bash
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          missing=0

          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN is missing."
            missing=1
          fi

          if [ -z "$TRADIER_BASE_URL" ]; then
            echo "::error::TRADIER_BASE_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::DISCORD_BOT_TOKEN is missing."
            missing=1
          fi

          if [ -z "$DISCORD_GUILD_ID" ]; then
            echo "::error::DISCORD_GUILD_ID is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Create required folders
        shell: bash
        run: |
          mkdir -p state
          mkdir -p docs

      - name: Run all active ticker scanners
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python multi_ticker_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ticker-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ticker scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin HEAD:main; then
            echo "Scanner updates pushed successfully."
            exit 0
          fi

          echo "Remote changed during the scan. Rebasing and retrying."
          git pull --rebase origin main
          git push origin HEAD:main
