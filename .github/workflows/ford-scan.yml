name: Ford Options Scan

on:
  # Runs every 10 minutes on weekdays across the UTC window that covers
  # Ford market hours in Central Time during both CST and CDT.
  #
  # Python still performs the exact 8:30 AM-3:00 PM Central Time check.
  # The 3-minute offset also avoids scheduling directly at the top of the hour.
  schedule:
    - cron: "33-53/10 13 * * 1-5"
    - cron: "3-53/10 14-20 * * 1-5"

  # Allows manual testing from the GitHub Actions page.
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scans from editing and pushing the log at the same time.
concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Ford options scan
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -d "state" ]; then
            git add -A state
          fi

          if [ -d "docs" ]; then
            git add -A docs
          fi

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
