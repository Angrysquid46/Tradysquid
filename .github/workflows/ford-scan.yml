name: Ford Options Scan

on:
  schedule:
    # Regular U.S. market session in Central Time.
    # 8:30 AM and 8:45 AM.
    - cron: "30,45 8 * * 1-5"
      timezone: "America/Chicago"

    # Every 15 minutes from 9:00 AM through 2:45 PM.
    - cron: "0,15,30,45 9-14 * * 1-5"
      timezone: "America/Chicago"

    # Final regular-session scan at 3:00 PM.
    - cron: "0 15 * * 1-5"
      timezone: "America/Chicago"

  # Keeps the manual Run workflow button available.
  workflow_dispatch:

permissions:
  contents: write

# Prevent scheduled and manual runs from modifying the trade log simultaneously.
concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan and update Ford trades
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify required secrets
        shell: bash
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          missing=0

          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN is missing."
            missing=1
          fi

          if [ -z "$TRADIER_BASE_URL" ]; then
            echo "::error::TRADIER_BASE_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Create required folders
        shell: bash
        run: |
          mkdir -p state
          mkdir -p docs

      - name: Run Ford options scanner
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ford_scan.py

      - name: Commit updated trade state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No trade-state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin HEAD:main; then
            echo "Scanner updates pushed successfully."
            exit 0
          fi

          echo "The remote branch changed during this run. Rebasing and retrying."
          git pull --rebase origin main
          git push origin HEAD:main
