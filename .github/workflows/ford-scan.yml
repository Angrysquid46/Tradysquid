name: Ford Options Scan

on:
  schedule:
    # Every 15 minutes during regular market hours, Central Time.
    # GitHub handles CST/CDT automatically through America/Chicago.

    # 8:30 AM and 8:45 AM CT
    - cron: "30,45 8 * * 1-5"
      timezone: "America/Chicago"

    # Every 15 minutes from 9:00 AM through 2:45 PM CT
    - cron: "0,15,30,45 9-14 * * 1-5"
      timezone: "America/Chicago"

    # Final session scan at 3:00 PM CT
    - cron: "0 15 * * 1-5"
      timezone: "America/Chicago"

  # Keeps the manual Run workflow button available.
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple scans from updating the same trades simultaneously.
concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Ford options scan
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          TRADIER_ACCOUNT_ID: ${{ secrets.TRADIER_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -d "state" ]; then
            git add -A -- state
          fi

          if [ -d "docs" ]; then
            git add -A -- docs
          fi

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if ! git push origin HEAD:main; then
            echo "Remote changed during scan. Rebasing and retrying."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
