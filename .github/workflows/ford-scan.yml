name: Ford Options Scan

run-name: "Ford scan • ${{ github.event_name }} • #${{ github.run_number }}"

on:
  schedule:
    # Every 15 minutes on weekdays across the UTC window covering
    # Central Time market hours during both CDT and CST.
    #
    # Runs at :08, :23, :38, and :53.
    # ford_scan.py performs the exact Central-Time market-hours check.
    - cron: "8,23,38,53 13-21 * * 1-5"

  # Keeps the manual Run workflow button available.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan and update Ford plays
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"

    steps:
      - name: Show trigger information
        shell: bash
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Central: $(TZ=America/Chicago date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      - name: Verify required secrets
        shell: bash
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          missing=0

          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN is missing."
            missing=1
          fi

          if [ -z "$TRADIER_BASE_URL" ]; then
            echo "::error::TRADIER_BASE_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is missing."
            missing=1
          fi

          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::DISCORD_BOT_TOKEN is missing."
            missing=1
          fi

          if [ -z "$DISCORD_GUILD_ID" ]; then
            echo "::error::DISCORD_GUILD_ID is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required secrets are configured."

      - name: Create required folders
        shell: bash
        run: |
          mkdir -p state
          mkdir -p docs

      - name: Run Ford options scanner
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin HEAD:main; then
            echo "Scanner updates pushed successfully."
            exit 0
          fi

          echo "Remote changed during the scan. Rebasing and retrying."
          git pull --rebase origin main
          git push origin HEAD:main
