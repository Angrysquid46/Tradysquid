name: Ford Options Scan

run-name: "Ford scan • ${{ github.event_name }} • #${{ github.run_number }}"

on:
  schedule:
    # Every 15 minutes on weekdays across the UTC window that covers
    # Central Time market hours in both CDT and CST.
    # Offset from :00/:15/:30/:45 to reduce GitHub scheduler congestion.
    # ford_scan.py performs the exact 8:30 AM-3:00 PM Central market gate.
    - cron: "8,23,38,53 13-21 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan and update Ford paper plays
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
      MAX_NEW_PLAYS_PER_SCAN: "4"
      REENTRY_COOLDOWN_MINUTES: "90"
      DISCORD_SYNC_EXISTING_OPEN: "true"

    steps:
      - name: Show trigger information
        shell: bash
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Central: $(TZ=America/Chicago date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile ford_scan.py

      - name: Verify required secrets
        shell: bash
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          missing=0
          for name in TRADIER_TOKEN TRADIER_BASE_URL DISCORD_WEBHOOK_URL DISCORD_BOT_TOKEN DISCORD_GUILD_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "Required secrets are configured."

      - name: Create required folders
        run: mkdir -p state docs

      - name: Run Ford options scanner
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python ford_scan.py

      - name: Commit updated state and dashboard
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No state or dashboard changes to commit."
            exit 0
          fi

          git commit -m "Ford scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin HEAD:main; then
            echo "Scanner updates pushed successfully."
            exit 0
          fi

          echo "Remote changed during the scan. Rebasing and retrying."
          git pull --rebase origin main
          git push origin HEAD:main
