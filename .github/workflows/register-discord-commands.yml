name: Register Discord Commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    name: Register private TradeBot slash commands
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate registration script
        run: python -m py_compile register_discord_commands.py

      - name: Register guild commands
        env:
          DISCORD_APPLICATION_ID: "1532107630951272508"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python register_discord_commands.py
