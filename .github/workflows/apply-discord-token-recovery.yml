name: Apply Discord Token Recovery

on:
  pull_request:
    paths:
      - 'tradysquid/operations/discord_token_recovery.py'
      - 'tests/unit/test_discord_token_recovery.py'
      - 'tests/unit/test_setup_discord_token_recovery.py'
      - 'scripts/apply_discord_token_recovery_setup.py'
      - '.github/workflows/apply-discord-token-recovery.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clean-build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Apply exact production patch
        run: python scripts/apply_discord_token_recovery_setup.py
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $Files = Get-ChildItem -Recurse -Filter '*.ps1'
          foreach ($File in $Files) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $File.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parsing failed for $($File.FullName)"
            }
          }
      - name: Run exact Discord recovery tests
        run: >-
          python -m pytest -q
          tests/unit/test_discord_token_recovery.py
          tests/unit/test_setup_discord_token_recovery.py
          tests/unit/test_live_verification_offhours.py
          tests/unit/test_credential_migration.py
          tests/unit/test_setup_live_preflight_reporting.py
          tests/unit/test_live_preflight_receipt_parser.py
      - name: Commit tested production repair
        shell: powershell
        run: |
          git config user.name 'tradysquid-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add `
            scripts/setup.ps1 `
            scripts/verify_live.py `
            tradysquid/operations/discord_token_recovery.py `
            tests/unit/test_discord_token_recovery.py `
            tests/unit/test_setup_discord_token_recovery.py
          git rm `
            scripts/apply_discord_token_recovery_setup.py `
            .github/workflows/apply-discord-token-recovery.yml
          if (git diff --cached --quiet) {
            throw 'Discord token recovery patch produced no committed changes.'
          }
          git commit -m 'Recover valid Discord token before full installation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
