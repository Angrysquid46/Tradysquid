name: Validate Simple Upgrade Flow

on:
  pull_request:
    paths:
      - "run_supervisor_simple.py"
      - "simple_upgrade_runtime.py"
      - "diagnostic_upgrade_system.py"
      - "diagnostic_runtime_integration.py"
      - "diagnostic_startup_runtime.py"
      - "shared_upgrade_lifecycle.py"
      - "run_with_env.py"
      - "START-SUPERVISOR.cmd"
      - "ENSURE-SUPERVISOR.ps1"
      - "stop_tradysquid_processes.ps1"
      - "github_upgrade_bridge.py"
      - "github_upgrade_patch.py"
      - ".gitignore"
      - "test_simple_upgrade_flow.py"
      - "test_diagnostic_upgrade_system.py"
      - "test_diagnostic_startup_runtime.py"
      - "test_runtime_state_hygiene.py"
      - ".github/workflows/validate-simple-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create isolated environment
        run: cp .env.example .env
      - name: Compile upgrade deployment and diagnostics
        run: |
          python -m py_compile \
            run_supervisor_simple.py \
            simple_upgrade_runtime.py \
            diagnostic_upgrade_system.py \
            diagnostic_runtime_integration.py \
            diagnostic_startup_runtime.py \
            shared_upgrade_lifecycle.py \
            tradysquid_supervisor.py \
            github_upgrade_bridge.py \
            github_upgrade_patch.py \
            run_with_env.py \
            applied_upgrades.py \
            network_compat.py
      - name: Run existing safety tests
        run: |
          python -m unittest -q \
            test_github_upgrade_bridge.py \
            test_supervisor_availability.py \
            test_runtime_state_hygiene.py \
            test_applied_upgrades.py
      - name: Run simple updater and diagnostic contracts
        run: |
          python -m unittest -q \
            test_applied_upgrades.py \
            test_simple_upgrade_flow.py \
            test_diagnostic_upgrade_system.py \
            test_diagnostic_startup_runtime.py
