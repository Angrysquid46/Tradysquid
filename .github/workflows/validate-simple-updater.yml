name: Validate Simple Upgrade Flow

on:
  pull_request:
    paths:
      - "run_supervisor_simple.py"
      - "START-SUPERVISOR.cmd"
      - "ENSURE-SUPERVISOR.ps1"
      - "stop_tradysquid_processes.ps1"
      - "github_upgrade_bridge.py"
      - "test_simple_upgrade_flow.py"
      - ".github/workflows/validate-simple-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create isolated environment
        run: cp .env.example .env
      - name: Compile simple deployment path
        run: |
          python -m py_compile \
            run_supervisor_simple.py \
            tradysquid_supervisor.py \
            github_upgrade_bridge.py \
            github_upgrade_patch.py \
            run_with_env.py \
            network_compat.py
      - name: Run upgrade-flow and safety tests
        run: |
          python -m unittest -q \
            test_simple_upgrade_flow.py \
            test_github_upgrade_bridge.py \
            test_supervisor_availability.py \
            test_runtime_state_hygiene.py \
            test_applied_upgrades.py
