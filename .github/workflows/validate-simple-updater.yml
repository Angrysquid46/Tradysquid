name: Validate Simple Upgrade Flow

on:
  pull_request:
    paths:
      - "run_supervisor_simple.py"
      - "runtime_contract.py"
      - "single_owner_runtime.py"
      - "ngrok_process_runtime.py"
      - "simple_upgrade_runtime.py"
      - "applied_upgrade_status_runtime.py"
      - "diagnostic_upgrade_system.py"
      - "diagnostic_runtime_integration.py"
      - "diagnostic_startup_runtime.py"
      - "diagnostic_nonblocking_runtime.py"
      - "diagnostic_state_migration.py"
      - "diagnostic_review_runtime.py"
      - "discord_command_diagnostics.py"
      - "supervisor_diagnostic_runtime.py"
      - "scheduler_diagnostic_runtime.py"
      - "github_upgrade_bridge_runtime.py"
      - "shared_upgrade_lifecycle.py"
      - "upgrade_lifecycle_dashboard.py"
      - "market_calendar_runtime.py"
      - "deployment_validation_manifest.py"
      - "run_with_env.py"
      - "START-SUPERVISOR.cmd"
      - "ENSURE-SUPERVISOR.ps1"
      - "stop_tradysquid_processes.ps1"
      - "github_upgrade_bridge.py"
      - "github_upgrade_patch.py"
      - ".gitignore"
      - "test_simple_upgrade_flow.py"
      - "test_runtime_contract.py"
      - "test_single_owner_runtime.py"
      - "test_ngrok_process_runtime.py"
      - "test_applied_upgrade_status_runtime.py"
      - "test_diagnostic_upgrade_system.py"
      - "test_diagnostic_startup_runtime.py"
      - "test_diagnostic_nonblocking_runtime.py"
      - "test_diagnostic_state_migration.py"
      - "test_diagnostic_review_runtime.py"
      - "test_discord_command_diagnostics.py"
      - "test_supervisor_diagnostic_runtime.py"
      - "test_supervisor_entrypoint_diagnostics.py"
      - "test_scheduler_diagnostic_runtime.py"
      - "test_github_upgrade_bridge_runtime.py"
      - "test_upgrade_lifecycle_dashboard.py"
      - "test_market_calendar_runtime.py"
      - "test_runtime_state_hygiene.py"
      - ".github/repair-clean-installer-log-lock-trigger"
      - ".github/workflows/validate-simple-updater.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create isolated environment
        run: cp .env.example .env
      - name: Validate deployment manifest
        run: python -c "import deployment_validation_manifest as m; print(m.validate_manifest())"
      - name: Compile the exact laptop deployment modules
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import deployment_validation_manifest as manifest

          raise SystemExit(
              subprocess.run(
                  [sys.executable, "-m", "py_compile", *manifest.COMPILE_MODULES]
              ).returncode
          )
          PY
      - name: Run the exact laptop focused tests
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import deployment_validation_manifest as manifest

          raise SystemExit(
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "unittest",
                      "-q",
                      *manifest.FOCUSED_TEST_MODULES,
                  ]
              ).returncode
          )
          PY
      - name: Verify one intended supervisor and minimal runtime attachment
        run: |
          grep -q "run_supervisor_simple.py" START-SUPERVISOR.cmd
          ! grep -E "python -u.*run_supervisor_resilient.py" START-SUPERVISOR.cmd
          grep -q "include_supervisor_guard" run_with_env.py
          grep -q "single_owner_runtime.install()" run_with_env.py
          grep -q "ngrok_process_runtime.install()" run_with_env.py
          grep -q "return \[executable, \"http\", \"8080\"\]" ngrok_process_runtime.py
          ! grep -q "sys.executable" ngrok_process_runtime.py
          grep -q "run_supervisor_simple.py" single_owner_runtime.py
          grep -q "START-SUPERVISOR" single_owner_runtime.py
          grep -q "Stop-ExtraOwnership" ENSURE-SUPERVISOR.ps1
          grep -q "runtime_contract.install_information_engine()" run_with_env.py
          grep -q "supervisor_diagnostic_runtime.install()" runtime_contract.py
          grep -q "scheduler_diagnostic_runtime.install()" runtime_contract.py
          grep -q "review.install()" runtime_contract.py
          grep -q "outbound_connectivity_runtime.install()" runtime_contract.py
          grep -q "dedupe_and_retire_jobs" runtime_contract.py
          ! grep -q "diagnostic_state_migration.install()" run_with_env.py runtime_contract.py
          ! grep -q "upgrade_batch_44_live_acceptance.install()" run_with_env.py runtime_contract.py
          ! grep -q "applied_upgrades.install_engine()" run_with_env.py runtime_contract.py

  repair-installer-log-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'trigger-main-clean-installer-repair'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean rebuild
        uses: actions/checkout@v4
        with:
          ref: clean-rebuild
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire runtime fix and add regression coverage
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path.cwd()
          installer = root / "scripts" / "install_clean_rebuild.ps1"
          source = installer.read_text(encoding="utf-8")
          helper_line = ". (Join-Path $ScriptRoot 'installer_helpers.ps1')\n"
          fixed_lines = (
              helper_line
              + ". (Join-Path $ScriptRoot 'installer_runtime_fixes.ps1')\n"
          )
          if fixed_lines not in source:
              if helper_line not in source:
                  raise SystemExit("installer helper source marker was not found")
              source = source.replace(helper_line, fixed_lines, 1)
              installer.write_text(source, encoding="utf-8", newline="\n")

          test_path = root / "tests" / "unit" / "test_installer_log_lock_regression.py"
          test_path.write_text(
              '''from __future__ import annotations

from pathlib import Path


ROOT = Path(__file__).resolve().parents[2]
INSTALLER = ROOT / "scripts" / "install_clean_rebuild.ps1"
BASE_HELPERS = ROOT / "scripts" / "installer_helpers.ps1"
RUNTIME_FIXES = ROOT / "scripts" / "installer_runtime_fixes.ps1"


def test_production_installer_loads_log_lock_override_after_base_helpers() -> None:
    source = INSTALLER.read_text(encoding="utf-8")
    base = ". (Join-Path $ScriptRoot 'installer_helpers.ps1')"
    override = ". (Join-Path $ScriptRoot 'installer_runtime_fixes.ps1')"
    assert base in source
    assert override in source
    assert source.index(base) < source.index(override)


def test_redirected_logs_are_never_rewritten_in_place() -> None:
    source = RUNTIME_FIXES.read_text(encoding="utf-8")
    assert "setup-child-stdout.raw.log" in source
    assert "setup-child-stderr.raw.log" in source
    assert "RedirectStandardOutput = $RawStdoutPath" in source
    assert "RedirectStandardError = $RawStderrPath" in source
    assert "$Process.Dispose()" in source
    assert "Write-SanitizedLogFile -SourcePath $RawStdoutPath -DestinationPath $StdoutPath" in source
    assert "Write-SanitizedLogFile -SourcePath $RawStderrPath -DestinationPath $StderrPath" in source
    assert "Read-SharedTextFile" in source
    assert "Remove-FileAfterRedirectRelease" in source


def test_old_locked_log_rewrite_remains_overridden_not_active() -> None:
    base_source = BASE_HELPERS.read_text(encoding="utf-8")
    override_source = RUNTIME_FIXES.read_text(encoding="utf-8")
    assert "[IO.File]::WriteAllText($StdoutPath" in base_source
    assert "function Invoke-SetupProcess" in override_source
    assert "Never rewrite the file used by RedirectStandardOutput" in override_source


def test_log_sanitation_cannot_replace_setup_receipt_as_pass_fail_gate() -> None:
    installer_source = INSTALLER.read_text(encoding="utf-8")
    assert "Read-CurrentSetupReceipt" in installer_source
    assert "if ($SetupExitCode -ne 0)" in installer_source
    assert "if ($null -eq $SetupReceipt)" in installer_source
    assert "if ($ReceiptStatus -ne 'PASS')" in installer_source
''',
              encoding="utf-8",
              newline="\n",
          )
          '@ | python -

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $Failures = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ErrorRecord in $Errors) {
              $Failures += "$($_.FullName):$($ErrorRecord.Extent.StartLineNumber):$($ErrorRecord.Extent.StartColumnNumber) $($ErrorRecord.Message)"
            }
          }
          if ($Failures.Count -gt 0) {
            $Failures | ForEach-Object { Write-Host $_ }
            throw 'PowerShell parsing failed.'
          }

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run installer regression tests
        shell: pwsh
        run: python -m pytest -q tests/unit/test_installer_log_lock_regression.py tests/unit/test_installer_contract.py tests/unit/test_readiness_timeout_regression.py tests/unit/test_production_failure_contract.py

      - name: Commit verified repair to clean rebuild
        shell: pwsh
        run: |
          git config user.name "Tradysquid Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/install_clean_rebuild.ps1 tests/unit/test_installer_log_lock_regression.py
          if (git diff --cached --quiet) {
            Write-Host 'Repair was already present.'
            exit 0
          }
          git commit -m "Wire Windows installer log-lock fix"
          git push origin HEAD:clean-rebuild
