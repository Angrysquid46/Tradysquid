name: Ford Intelligence Briefing

run-name: "Ford intelligence • ${{ github.event_name }} • #${{ github.run_number }}"

on:
  # Local monitoring handles recurring briefings. This workflow remains an
  # on-demand cloud backup without recurring GitHub Actions usage.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ford-options-scan
  cancel-in-progress: false

jobs:
  briefing:
    name: Update Ford news, events, and market context
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate scanner syntax
        run: python -m py_compile ford_scan.py

      - name: Run Ford intelligence briefing
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python ford_scan.py --intelligence-only

      - name: Commit updated intelligence state and charts
        shell: bash
        run: |
          git config user.name "ford-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- state docs

          if git diff --cached --quiet; then
            echo "No intelligence changes to commit."
            exit 0
          fi

          git commit -m "Ford intelligence update: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if git push origin HEAD:main; then
            exit 0
          fi

          git pull --rebase origin main
          git push origin HEAD:main
