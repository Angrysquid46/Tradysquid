name: Repin Live Preflight Degraded Mode

on:
  pull_request:
    paths:
      - 'scripts/repin_live_preflight_degraded_mode.py'
      - '.github/workflows/repin-live-preflight-degraded-mode.yml'

permissions:
  contents: write

jobs:
  repin-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create isolated test environment
        shell: powershell
        run: |
          @'
          DISCORD_BOT_TOKEN=test-token
          DISCORD_GUILD_ID=123456789
          DISCORD_OWNER_USER_ID=987654321
          TRADIER_ACCESS_TOKEN=test-tradier-token
          TRADIER_ENVIRONMENT=paper
          '@ | Set-Content -LiteralPath .env -Encoding UTF8
      - name: Apply atomic repin
        run: python scripts/repin_live_preflight_degraded_mode.py
      - name: Verify exact references
        shell: powershell
        run: |
          $Old = '831559b1de1cd90eb8df47e32e5462eabf4b8fa0'
          $New = 'eb1b04b2d6deeee42df8d939acb328e26d693f7f'
          $Files = @('RUN-AUDITED-TRADYSQUID-INSTALL.ps1','clean_rebuild_auto_handoff.py','test_visible_manual_installer.py','test_simple_upgrade_flow.py')
          foreach ($File in $Files) {
            $Text = Get-Content -LiteralPath $File -Raw
            if ($Text.Contains($Old)) { throw "Stale clean commit remains in $File" }
            if (-not $Text.Contains($New)) { throw "New clean commit is missing from $File" }
          }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'RUN-AUDITED-TRADYSQUID-INSTALL.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Run exact deployment tests
        run: python -m unittest -q test_visible_manual_installer test_simple_upgrade_flow
      - name: Commit tested repin
        shell: powershell
        run: |
          Remove-Item -LiteralPath .env -Force -ErrorAction SilentlyContinue
          git config user.name 'tradysquid-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Repin produced no committed changes.' }
          git commit -m 'Repin installers to degraded live preflight build'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
