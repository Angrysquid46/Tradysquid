name: Validate Runtime State Hygiene

on:
  pull_request:
    paths:
      - ".gitignore"
      - "state/discord-report-state.json"
      - "state/ford-plays-log.csv"
      - "test_runtime_state_hygiene.py"
      - ".github/workflows/validate-runtime-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify generated state is ignored and absent
        run: python -m unittest -q test_runtime_state_hygiene.py
