name: Validate Tradysquids Automation

on:
  pull_request:
    paths:
      - "learning_center_index.py"
      - "performance_reconciliation.py"
      - "performance_scorecards.py"
      - "performance_channel_structure.py"
      - "journal_contract.py"
      - "always_on_operations.py"
      - "operations_acceptance.py"
      - "local_information_engine.py"
      - "local_information_engine_public.py"
      - "local_information_engine_bootstrap.py"
      - "run_with_env.py"
      - "network_compat.py"
      - "diagnostic_upgrade_system.py"
      - "diagnostic_review_runtime.py"
      - "diagnostic_startup_runtime.py"
      - "github_upgrade_bridge_runtime.py"
      - "shared_upgrade_lifecycle.py"
      - "market_calendar_runtime.py"
      - "github_upgrade_bridge.py"
      - "upgrade_batch_44.py"
      - "sync_discord_structure.py"
      - "sync_discord_structure_public.py"
      - "sync_discord_structure_reports.py"
      - "discord_command_bot_public.py"
      - "register_discord_commands_public.py"
      - "run_supervisor.py"
      - "run_supervisor_resilient.py"
      - "run_supervisor_simple.py"
      - "automation_acceptance.py"
      - "ENSURE-SUPERVISOR.ps1"
      - "SUPERVISOR-DIAGNOSTICS.ps1"
      - "INSTALL-REMOTE-CONTROL.cmd"
      - "INSTALL-SUPERVISOR-WATCHDOG.ps1"
      - "START-SUPERVISOR.cmd"
      - "stop_tradysquid_processes.ps1"
      - ".gitignore"
      - "test_supervisor_availability.py"
      - "test_supervisor_discord_readiness.py"
      - "test_supervisor_entrypoint_diagnostics.py"
      - "test_diagnostic_upgrade_system.py"
      - "test_diagnostic_review_runtime.py"
      - "test_diagnostic_startup_runtime.py"
      - "test_github_upgrade_bridge_runtime.py"
      - "test_market_calendar_runtime.py"
      - "test_runtime_state_hygiene.py"
      - "test_automation_acceptance.py"
      - "test_always_on_operations.py"
      - "test_market_intelligence_visibility.py"
      - "test_market_intelligence_bootstrap.py"
      - "test_performance_reconciliation.py"
      - "test_journal_contract.py"
      - "test_github_upgrade_bridge.py"
      - "test_upgrade_batch_44.py"
      - ".github/workflows/validate-learning-center.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Create isolated test environment
        run: cp .env.example .env

      - name: Compile deployment modules
        run: python -c "import py_compile, deployment_validation_manifest as m; [py_compile.compile(path, doraise=True) for path in m.COMPILE_MODULES]"

      - name: Validate operations engine
        run: |
          python journal_contract.py
          python upgrade_batch_44.py
          python diagnostic_upgrade_system.py

      - name: Run focused tests
        run: |
          python -m unittest -q $(python -c "import deployment_validation_manifest as m; print(' '.join(m.FOCUSED_TEST_MODULES))")
