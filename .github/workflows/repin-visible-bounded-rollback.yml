name: Repin Visible Bounded Rollback

on:
  pull_request:
    paths:
      - 'scripts/repin_visible_bounded_rollback.py'
      - '.github/workflows/repin-visible-bounded-rollback.yml'

permissions:
  contents: write

jobs:
  repin-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply atomic repin
        run: python scripts/repin_visible_bounded_rollback.py
      - name: Verify exact references
        shell: powershell
        run: |
          $Old = '9564ab1d86669b082386875e3e4e2702543bfb2e'
          $New = '254d67d0cf2a796fd9689693c7b061ce98ae2c63'
          $Files = @('RUN-AUDITED-TRADYSQUID-INSTALL.ps1','clean_rebuild_auto_handoff.py','test_visible_manual_installer.py','test_simple_upgrade_flow.py')
          foreach ($File in $Files) {
            $Text = Get-Content -LiteralPath $File -Raw
            if ($Text.Contains($Old)) { throw "Stale clean commit remains in $File" }
            if (-not $Text.Contains($New)) { throw "New clean commit is missing from $File" }
          }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'RUN-AUDITED-TRADYSQUID-INSTALL.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Run exact deployment tests
        run: python -m unittest -q test_visible_manual_installer test_simple_upgrade_flow
      - name: Commit tested repin
        shell: powershell
        run: |
          git config user.name 'tradysquid-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Repin produced no committed changes.' }
          git commit -m 'Repin installers to visible bounded rollback build'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
