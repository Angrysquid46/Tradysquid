name: Patch Windows installer log lock

on:
  push:
    branches:
      - clean-rebuild
    paths:
      - ".github/workflows/patch-installer-log-lock.yml"
  pull_request:
    branches:
      - clean-rebuild
    paths:
      - ".github/installer-log-lock-trigger"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean rebuild
        uses: actions/checkout@v4
        with:
          ref: clean-rebuild
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire runtime fix and add regression coverage
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path.cwd()
          installer = root / "scripts" / "install_clean_rebuild.ps1"
          source = installer.read_text(encoding="utf-8")
          helper_line = ". (Join-Path $ScriptRoot 'installer_helpers.ps1')\n"
          fixed_lines = (
              helper_line
              + ". (Join-Path $ScriptRoot 'installer_runtime_fixes.ps1')\n"
          )
          if fixed_lines not in source:
              if helper_line not in source:
                  raise SystemExit("installer helper source marker was not found")
              source = source.replace(helper_line, fixed_lines, 1)
              installer.write_text(source, encoding="utf-8", newline="\n")

          test_path = root / "tests" / "unit" / "test_installer_log_lock_regression.py"
          test_path.write_text(
              '''from __future__ import annotations

from pathlib import Path


ROOT = Path(__file__).resolve().parents[2]
INSTALLER = ROOT / "scripts" / "install_clean_rebuild.ps1"
BASE_HELPERS = ROOT / "scripts" / "installer_helpers.ps1"
RUNTIME_FIXES = ROOT / "scripts" / "installer_runtime_fixes.ps1"


def test_production_installer_loads_log_lock_override_after_base_helpers() -> None:
    source = INSTALLER.read_text(encoding="utf-8")
    base = ". (Join-Path $ScriptRoot 'installer_helpers.ps1')"
    override = ". (Join-Path $ScriptRoot 'installer_runtime_fixes.ps1')"
    assert base in source
    assert override in source
    assert source.index(base) < source.index(override)


def test_redirected_logs_are_never_rewritten_in_place() -> None:
    source = RUNTIME_FIXES.read_text(encoding="utf-8")
    assert "setup-child-stdout.raw.log" in source
    assert "setup-child-stderr.raw.log" in source
    assert "RedirectStandardOutput = $RawStdoutPath" in source
    assert "RedirectStandardError = $RawStderrPath" in source
    assert "$Process.Dispose()" in source
    assert "Write-SanitizedLogFile -SourcePath $RawStdoutPath -DestinationPath $StdoutPath" in source
    assert "Write-SanitizedLogFile -SourcePath $RawStderrPath -DestinationPath $StderrPath" in source
    assert "Read-SharedTextFile" in source
    assert "Remove-FileAfterRedirectRelease" in source


def test_old_locked_log_rewrite_remains_overridden_not_active() -> None:
    base_source = BASE_HELPERS.read_text(encoding="utf-8")
    override_source = RUNTIME_FIXES.read_text(encoding="utf-8")
    assert "[IO.File]::WriteAllText($StdoutPath" in base_source
    assert "function Invoke-SetupProcess" in override_source
    assert "Never rewrite the file used by RedirectStandardOutput" in override_source


def test_log_sanitation_cannot_replace_setup_receipt_as_pass_fail_gate() -> None:
    installer_source = INSTALLER.read_text(encoding="utf-8")
    assert "Read-CurrentSetupReceipt" in installer_source
    assert "if ($SetupExitCode -ne 0)" in installer_source
    assert "if ($null -eq $SetupReceipt)" in installer_source
    assert "if ($ReceiptStatus -ne 'PASS')" in installer_source
''',
              encoding="utf-8",
              newline="\n",
          )
          '@ | python -

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $Failures = @()
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            foreach ($ErrorRecord in $Errors) {
              $Failures += "$($_.FullName):$($ErrorRecord.Extent.StartLineNumber):$($ErrorRecord.Extent.StartColumnNumber) $($ErrorRecord.Message)"
            }
          }
          if ($Failures.Count -gt 0) {
            $Failures | ForEach-Object { Write-Host $_ }
            throw 'PowerShell parsing failed.'
          }

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run installer regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests/unit/test_installer_log_lock_regression.py tests/unit/test_installer_contract.py tests/unit/test_readiness_timeout_regression.py tests/unit/test_production_failure_contract.py

      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name "Tradysquid Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/install_clean_rebuild.ps1 tests/unit/test_installer_log_lock_regression.py
          if (git diff --cached --quiet) {
            Write-Host 'Repair was already present.'
            exit 0
          }
          git commit -m "Wire Windows installer log-lock fix"
          git push origin HEAD:clean-rebuild
