name: Repin StrictMode Live Receipt

on:
  pull_request:
    paths:
      - 'scripts/repin_strictmode_live_receipt.py'
      - '.github/workflows/repin-strictmode-live-receipt.yml'

permissions:
  contents: write

jobs:
  repin-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Create isolated test environment
        shell: powershell
        run: |
          @(
            'DISCORD_BOT_TOKEN=test-token'
            'DISCORD_GUILD_ID=1'
            'DISCORD_OWNER_USER_ID=2'
            'TRADIER_ACCESS_TOKEN=test-token'
            'TRADIER_ENVIRONMENT=paper'
          ) | Set-Content -LiteralPath .env -Encoding UTF8
      - name: Apply atomic repin
        run: python scripts/repin_strictmode_live_receipt.py
      - name: Verify exact references
        shell: powershell
        run: |
          $Old = 'eb1b04b2d6deeee42df8d939acb328e26d693f7f'
          $New = 'f71acae7f7a502bdf64feda5b87e1f26111bffe6'
          $Targets = @(
            'RUN-AUDITED-TRADYSQUID-INSTALL.ps1',
            'clean_rebuild_auto_handoff.py',
            'test_simple_upgrade_flow.py',
            'test_visible_manual_installer.py'
          )
          foreach ($Target in $Targets) {
            $Text = Get-Content -LiteralPath $Target -Raw
            if ($Text.Contains($Old)) { throw "Stale clean commit remains in $Target" }
            if (-not $Text.Contains($New)) { throw "New clean commit is missing from $Target" }
          }
          $Tokens=$null; $Errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'RUN-AUDITED-TRADYSQUID-INSTALL.ps1'), [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count -gt 0) { $Errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Run exact deployment tests
        run: python -m pytest -q test_visible_manual_installer.py test_simple_upgrade_flow.py deployment_validation_manifest.py
      - name: Commit tested repin
        shell: powershell
        run: |
          git config user.name 'tradysquid-validation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add RUN-AUDITED-TRADYSQUID-INSTALL.ps1 clean_rebuild_auto_handoff.py test_simple_upgrade_flow.py test_visible_manual_installer.py
          git rm scripts/repin_strictmode_live_receipt.py .github/workflows/repin-strictmode-live-receipt.yml
          if (git diff --cached --quiet) { throw 'Repin produced no committed changes.' }
          git commit -m 'Repin installer to strict-mode-safe live receipt build'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
